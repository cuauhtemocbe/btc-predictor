repos:
  # Secret scanning (runs on pre-commit, before anything reaches git history)
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.9.0
    hooks:
      - id: gitleaks

  # Ruff linter and formatter (runs on pre-commit)
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.14
    hooks:
      - id: ruff
        name: Lint with ruff
        args: [--fix, --no-cache]
        files: ^(shared|api-service|workers|scripts)/
      - id: ruff-format
        name: Format with ruff
        args: [--no-cache]
        files: ^(shared|api-service|workers|scripts)/

  # mypy --strict on shared, workers, api and scripts (runs in Docker, needs
  # project's real dependencies/stubs — not the isolated venv the mirrors-mypy
  # hook uses). Same command as CI; see scripts/hooks/run-mypy.sh.
  - repo: local
    hooks:
      - id: mypy-docker
        name: Type-check with mypy --strict
        entry: scripts/hooks/run-mypy.sh
        language: system
        pass_filenames: false
        files: ^(shared|api-service|workers|scripts)/

  # Pytest with Docker (runs on pre-push)
  - repo: local
    hooks:
      - id: trivy-cve-gate
        name: Trivy fail-closed CVE gate
        entry: scripts/hooks/trivy-scan.sh
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]

      - id: pytest-docker
        name: Run tests in Docker
        entry: scripts/hooks/run-tests.sh
        language: system
        pass_filenames: false
        # Skip the full suite when the push touches no code, test
        # infrastructure or dependency files (docs/config-only pushes).
        files: ^((shared|api-service|workers|scripts)/|conftest\.py$|pyproject\.toml$|poetry\.lock$|docker-compose\.yml$|Dockerfile)
        stages: [pre-push]
