repos:
  # Secret scanning (runs on pre-commit, before anything reaches git history)
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.9.0
    hooks:
      - id: gitleaks

  # Ruff linter and formatter (runs on pre-commit)
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.14
    hooks:
      - id: ruff
        name: Lint with ruff
        args: [--fix, --no-cache]
        files: ^(shared|api-service|workers)/
      - id: ruff-format
        name: Format with ruff
        args: [--no-cache]
        files: ^(shared|api-service|workers)/

  # Pytest with Docker (runs on pre-push)
  - repo: local
    hooks:
      - id: pytest-docker
        name: Run tests in Docker
        entry: scripts/hooks/run-tests.sh
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]
