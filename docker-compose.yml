services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: btcpredictor
      POSTGRES_PASSWORD: btcpredictor
      POSTGRES_DB: btcpredictor
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U btcpredictor"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: Dockerfile.dev
    ports:
      - "8010:8000"
    volumes:
      # Devcontainer-style: the whole workspace is bind-mounted, so every host
      # edit is visible in the container immediately. (Single-file mounts go
      # stale when an editor replaces the file, since they pin the old inode.)
      - .:/app
      # The package is named `api` inside the container (tests, imports).
      - ./api-service:/app/api
    environment:
      - ENVIRONMENT=development
      - DATABASE_URL=postgresql://btcpredictor:btcpredictor@postgres:5432/btcpredictor
      - BINANCE_BASE_URL=https://api.binance.com
      - TZ=America/Mexico_City
      - PYTHONPATH=/app:/app/api:/app/shared:/app/scripts
    depends_on:
      postgres:
        condition: service_healthy
    # Watch only the code the API imports: with the whole workspace mounted,
    # the default (/app) would also reload on .git, caches and test artifacts.
    command: uvicorn api.main:app --host 0.0.0.0 --port 8000 --reload --reload-dir /app/api --reload-dir /app/shared
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      start_period: 60s
      retries: 3

volumes:
  postgres_data:
