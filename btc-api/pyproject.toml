[tool.poetry]
name = "btc-api"
version = "0.1.0"
description = "BTC Predictor API Service"
authors = ["Cuauhtémoc <cuauhtemocbe@gmail.com>"]
readme = "README.md"
packages = [{include = "btc_api"}]

[tool.poetry.dependencies]
python = "^3.13"
btc-shared = {path = "../shared", develop = true}
fastapi = "^0.115.0"
uvicorn = {extras = ["standard"], version = "^0.34.0"}
jinja2 = "^3.1.0"
httpx = "^0.28.0"

[tool.poetry.group.dev.dependencies]
pytest = "^8.3.0"
pytest-asyncio = "^0.24.0"
pytest-mock = "^3.14.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
