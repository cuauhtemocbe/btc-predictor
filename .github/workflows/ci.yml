name: CI

on:
  push:
    branches:
      - '**'
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Docker quality gate
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Start Docker Compose services
        run: docker compose up -d --wait

      - name: Run Ruff lint
        run: docker compose exec -T api ruff check shared api workers

      - name: Check Ruff formatting
        run: docker compose exec -T api ruff format --check shared api workers

      - name: Run mypy strict checks
        run: >-
          docker compose exec -T api python -m mypy
          shared/shared shared/btc_shared shared/tests

      - name: Run tests with coverage
        run: >-
          docker compose exec -T api pytest --cov --cov-report=term-missing
          --cov-report=xml:/tmp/coverage.xml

      - name: Copy coverage report
        if: always()
        run: docker compose cp api:/tmp/coverage.xml ./coverage.xml || true

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml
          if-no-files-found: ignore

      - name: Stop Docker Compose services
        if: always()
        run: docker compose down -v
