name: CI

# One run per change: PRs are checked on `pull_request`, and `push` only covers
# main. Triggering on every branch push as well ran the same job twice per
# commit (the two events never share a concurrency group).
on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Docker quality gate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      COMPOSE_PROJECT_NAME: btc-predictor

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # Build the api image through the GitHub Actions layer cache, then start
      # compose without rebuilding. Compose looks for <project>-api:latest, so
      # the project name and the tag are pinned together; --no-build makes a
      # mismatch fail loudly instead of silently rebuilding from scratch.
      - name: Build api image (layer cache)
        uses: docker/bake-action@v7
        with:
          source: .
          files: docker-compose.yml
          targets: api
          load: true
          set: |
            api.tags=btc-predictor-api:latest
            *.cache-from=type=gha,scope=quality-gate
            *.cache-to=type=gha,scope=quality-gate,mode=max

      - name: Start Docker Compose services
        run: docker compose up -d --wait --no-build

      - name: Run Ruff lint
        run: docker compose exec -T api ruff check shared api workers

      - name: Check Ruff formatting
        run: docker compose exec -T api ruff format --check shared api workers

      - name: Run mypy strict checks
        run: >-
          docker compose exec -T api python -m mypy
          shared/shared shared/btc_shared shared/tests

      - name: Run tests with coverage
        run: >-
          docker compose exec -T api pytest --cov --cov-report=term-missing
          --cov-report=xml:/tmp/coverage.xml

      - name: Copy coverage report
        if: always()
        run: docker compose cp api:/tmp/coverage.xml ./coverage.xml || true

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml
          if-no-files-found: ignore

      - name: Stop Docker Compose services
        if: always()
        run: docker compose down -v
