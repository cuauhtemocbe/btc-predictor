name: Scheduled Quality

on:
  schedule:
    - cron: '0 7 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: scheduled-quality
  cancel-in-progress: false

jobs:
  mutation:
    name: Cosmic Ray mutation testing
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Start Docker Compose services
        run: docker compose up -d --wait

      - name: Run mutation testing
        run: >-
          docker compose exec -T api sh -c
          'cosmic-ray init cosmic-ray.toml /tmp/session.sqlite &&
          cosmic-ray exec cosmic-ray.toml /tmp/session.sqlite &&
          cr-report /tmp/session.sqlite | tee /tmp/mutation-report.txt'

      - name: Copy mutation report
        if: always()
        run: docker compose cp api:/tmp/mutation-report.txt ./mutation-report.txt || true

      - name: Upload mutation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mutation-report
          path: mutation-report.txt
          if-no-files-found: ignore

      - name: Stop Docker Compose services
        if: always()
        run: docker compose down -v
