name: Scheduled Quality

on:
  schedule:
    - cron: '0 7 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: scheduled-quality
  cancel-in-progress: false

jobs:
  mutation:
    name: Cosmic Ray mutation testing
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Start Docker Compose services
        run: docker compose up -d --wait

      - name: Run mutation testing
        run: >-
          docker compose exec -T api sh -c
          'cosmic-ray init cosmic-ray.toml /tmp/session.sqlite &&
          cosmic-ray exec cosmic-ray.toml /tmp/session.sqlite &&
          cr-report /tmp/session.sqlite | tee /tmp/mutation-report.txt'

      - name: Copy mutation report
        if: always()
        run: docker compose cp api:/tmp/mutation-report.txt ./mutation-report.txt || true

      - name: Upload mutation report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mutation-report
          path: mutation-report.txt
          if-no-files-found: ignore

      - name: Stop Docker Compose services
        if: always()
        run: docker compose down -v
