name: Mutation Testing

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mutation-testing
  cancel-in-progress: false

jobs:
  mutation:
    name: Cosmic Ray mutation testing
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Start Docker Compose services
        run: docker compose up -d --wait

      # The workspace is bind-mounted at /app in the api container, so the
      # session database and the report land in ./mutation-output on the runner
      # and survive the container.
      - name: Initialise mutation session
        run: >-
          docker compose exec -T api sh -c
          'mkdir -p mutation-output &&
          cosmic-ray init cosmic-ray.toml mutation-output/session.sqlite'

      # Bounded below the 60 minute job limit: a job timeout cancels the
      # remaining steps, so exec stops itself and the report steps still run.
      # Exit 124 (SIGTERM) or 137 (SIGKILL after 2 m) means "out of time".
      - name: Run mutation testing (45 minute budget)
        run: |
          rc=0
          docker compose exec -T api timeout --kill-after=2m 45m \
            cosmic-ray exec cosmic-ray.toml mutation-output/session.sqlite || rc=$?
          if [ "$rc" -eq 124 ] || [ "$rc" -eq 137 ]; then
            echo "::warning::Mutation run hit its 45 minute budget; the report is partial."
            exit 0
          fi
          exit "$rc"

      - name: Write mutation report
        if: always()
        run: >-
          docker compose exec -T api sh -c
          'cr-report mutation-output/session.sqlite > mutation-output/mutation-report.txt'

      - name: Summarise mutation report
        if: always()
        run: |
          {
            echo "### Mutation testing"
            echo '```'
            grep -E '^(total jobs|complete|surviving mutants)' mutation-output/mutation-report.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload mutation report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mutation-report
          path: |
            mutation-output/mutation-report.txt
            mutation-output/session.sqlite
          if-no-files-found: error

      - name: Stop Docker Compose services
        if: always()
        run: docker compose down -v
