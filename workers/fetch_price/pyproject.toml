[tool.poetry]
name = "fetch-price"
version = "0.1.0"
description = "Worker to fetch hourly Bitcoin prices from Binance API"
authors = ["Cuauhtémoc <cuauhtemocbe@gmail.com>"]
readme = "README.md"
packages = [{include = "fetch_price", from = "."}]

[tool.poetry.dependencies]
python = "^3.13"
httpx = "^0.28.1"
shared = {path = "../shared", develop = true}

[tool.poetry.group.dev.dependencies]
pytest = "^8.3.4"
pytest-asyncio = "^0.25.2"
pytest-cov = "^6.0.0"
respx = "^0.21.1"
ruff = "^0.9.1"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]
ignore = []
