[tool.poetry]
name = "api"
version = "0.1.0"
description = "BTC Predictor API Service"
authors = ["Cuauhtémoc <cuauhtemocbe@gmail.com>"]
readme = "README.md"
packages = [{include = "api"}]

[tool.poetry.dependencies]
python = "^3.13"
shared = {path = "../shared", develop = true}
fastapi = ">=0.161.1"
# Transitive floors: the lock-less manifest is resolved fresh by Dependabot, so
# these keep it at the versions the root poetry.lock already resolves.
starlette = ">=1.9.0"
certifi = ">=2026.10.19"
uvicorn = {extras = ["standard"], version = "^0.34.0"}
jinja2 = "^3.1.0"
httpx = "^0.28.0"
# api-service has no lock: without this cap a clean build resolves
# SQLAlchemy 2.1, whose default driver is psycopg v3 (we ship psycopg2).
sqlalchemy = ">=2.0,<2.1"

[tool.poetry.group.dev.dependencies]
pytest = "^9.1.1"
pytest-asyncio = ">=1.4.0,<1.5"
pytest-mock = "^3.14.0"
beautifulsoup4 = "^4.12.0"
scikit-learn = "^1.5.0"
pandas = "^2.2.0"
numpy = "^2.0.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
