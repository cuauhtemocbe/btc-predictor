[tool.poetry]
name = "btc-predictor"
version = "0.1.0"
description = ""
authors = []
packages = [{include = "app", from = "src"}]

[tool.poetry.dependencies]
python = "^3.12"
fastapi = ">=0.115.7"
uvicorn = {extras = ["standard"], version = "^0.34.0"}
starlette = ">=0.49.1"
sqlalchemy = "^2.0"
psycopg2-binary = "^2.9"
alembic = "^1.13"
pydantic-settings = "^2.0"
urllib3 = ">=2.7.0"
httpx = "^0.28.1"
jinja2 = "^3.1.0"
shared = {path = "shared", develop = true}
scikit-learn = "^1.5.0"
numpy = "^2.0.0"
tensorflow-cpu = ">=2.13.0"
xgboost = ">=2.0.0"
statsmodels = ">=0.14.0"
yarl = ">=1.17.0,<1.24.0"

[tool.poetry.group.dev.dependencies]
pytest = "^8.3.0"
httpx = "^0.28.0"
pytest-asyncio = "^0.25.0"
pytest-cov = "^6.0.0"
ruff = "^0.9.0"
cosmic-ray = "^8.3"
asyncpg = "^0.30.0"
pytest-xdist = "^3.8.0"

[tool.pytest.ini_options]
asyncio_mode = "auto"
# Ensure pytest uses /app as root to discover conftest.py
# This is critical for centralized DB fixtures to work
pythonpath = "."
testpaths = [
    "shared/tests",
    "workers/daily/tests",
    "workers/fetch_price/tests",
    "workers/weekly/tests",
    "scripts/tests"
]

# Registrar markers para evitar warnings y habilitar ejecución selectiva
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests that require full DB setup",
    "unit: marks tests that use mocks/stubs only",
    "db: marks tests that use database fixtures",
    "asyncio: marks async tests (automatically detected)"
]

[tool.ruff]
line-length = 88
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.cosmic-ray]
module-path = "."
timeout = 30.0
excluded-modules = []
test-command = "pytest shared/tests/ api-service/tests/ workers/fetch_price/tests/ workers/daily/tests/"

[tool.cosmic-ray.distributor]
name = "local"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry-core.masonry.api"
