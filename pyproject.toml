[tool.poetry]
name = "btc-predictor"
version = "0.1.0"
description = ""
authors = []
packages = [{include = "app", from = "src"}]

[tool.poetry.dependencies]
python = "^3.12"
# Base dependencies (required by all services)
sqlalchemy = "^2.0"
psycopg2-binary = "^2.9"
alembic = "^1.13"
pydantic-settings = "^2.0"
shared = {path = "shared", develop = true}

[tool.poetry.group.api]
optional = true

[tool.poetry.group.api.dependencies]
fastapi = ">=0.115.7"
uvicorn = {extras = ["standard"], version = "^0.34.0"}
starlette = ">=0.49.1"
jinja2 = "^3.1.0"
httpx = "^0.28.1"
numpy = "^2.0.0"  # Required by shared/btc_shared/strategies.py

[tool.poetry.group.fetch]
optional = true

[tool.poetry.group.fetch.dependencies]
httpx = "^0.28.1"
urllib3 = ">=2.7.0"
yarl = ">=1.17.0,<1.24.0"

[tool.poetry.group.ml]
optional = true

[tool.poetry.group.ml.dependencies]
scikit-learn = "^1.5.0"
numpy = "^2.0.0"
tensorflow-cpu = ">=2.13.0"
xgboost = ">=2.0.0"
statsmodels = ">=0.14.0"

[tool.poetry.group.dev.dependencies]
pytest = "^8.3.0"
httpx = "^0.28.0"
pytest-asyncio = "^0.25.0"
pytest-cov = ">=6,<8"
ruff = "^0.9.0"
cosmic-ray = "^8.3"
asyncpg = "^0.30.0"
pytest-xdist = "^3.8.0"
mypy = "^1.14.0"

[tool.pytest.ini_options]
asyncio_mode = "auto"
# Ensure pytest uses /app as root to discover conftest.py
# This is critical for centralized DB fixtures to work
pythonpath = "."
# NOTE: "api/tests" (not "api-service/tests") because Dockerfile.dev mounts
# ./api-service to /app/api inside the container where tests actually run.
testpaths = [
    "shared/tests",
    "api/tests",
    "workers/daily/tests",
    "workers/fetch_price/tests",
    "workers/weekly/tests",
    "scripts/tests"
]
addopts = "--cov-fail-under=90"

# Registrar markers para evitar warnings y habilitar ejecución selectiva
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests that require full DB setup",
    "unit: marks tests that use mocks/stubs only",
    "db: marks tests that use database fixtures",
    "asyncio: marks async tests (automatically detected)"
]

[tool.mypy]
python_version = "3.13"
strict = true
plugins = ["pydantic.mypy"]
# explicit_package_bases + mypy_path lets mypy name shared/btc_shared/* as
# "btc_shared.*" and shared/tests/* as "tests.*" without adding __init__.py
# files there (which would break pytest test collection for sibling
# "tests" dirs elsewhere in the monorepo, e.g. workers/daily/tests).
mypy_path = "shared"
explicit_package_bases = true
files = ["shared/shared", "shared/btc_shared", "shared/tests"]
exclude = ["shared/alembic/", "shared/\\.venv/", "shared/poetry\\.lock"]

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false
disallow_incomplete_defs = false
disallow_untyped_calls = false
strict_optional = false
implicit_optional = true
disable_error_code = ["method-assign"]

[tool.ruff]
line-length = 88
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.ruff.lint.isort]
# Without this, ruff's first-party auto-detection disagrees between the
# host (repo root has "api-service/") and the dev container (Dockerfile.dev
# mounts it as "/app/api"), sorting "api.*" imports differently depending
# on where ruff runs from. Pin it explicitly so lint is deterministic.
known-first-party = ["api", "shared", "btc_shared", "workers"]

[tool.cosmic-ray]
module-path = "."
timeout = 30.0
excluded-modules = []
test-command = "pytest shared/tests/ api-service/tests/ workers/fetch_price/tests/ workers/daily/tests/"

[tool.cosmic-ray.distributor]
name = "local"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry-core.masonry.api"
