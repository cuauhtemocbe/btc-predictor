[tool.poetry]
name = "btc-predictor"
version = "0.1.0"
description = ""
authors = []
packages = [{include = "app", from = "src"}]

[tool.poetry.dependencies]
python = "^3.13"
# Base dependencies (required by all services)
sqlalchemy = "^2.0"
psycopg2-binary = "^2.9"
alembic = "^1.13"
pydantic-settings = "^2.0"
shared = {path = "shared", develop = true}

[tool.poetry.group.api]
optional = true

[tool.poetry.group.api.dependencies]
fastapi = ">=0.115.7"
uvicorn = {extras = ["standard"], version = ">=0.34,<0.55"}
starlette = ">=0.49.1"
jinja2 = "^3.1.0"
httpx = "^0.28.1"
numpy = "^2.0.0"  # Required by shared/shared/strategies.py

[tool.poetry.group.fetch]
optional = true

[tool.poetry.group.fetch.dependencies]
httpx = "^0.28.1"
urllib3 = ">=2.7.0"
yarl = ">=1.17.0,<1.26.0"

[tool.poetry.group.ml]
optional = true

[tool.poetry.group.ml.dependencies]
scikit-learn = "^1.5.0"
numpy = "^2.0.0"

[tool.poetry.group.dev.dependencies]
pytest = "^8.3.0"
httpx = "^0.28.0"
pytest-asyncio = ">=0.25,<1.5"
pytest-cov = ">=6,<8"
ruff = ">=0.9,<0.17"
cosmic-ray = "^8.3"
asyncpg = ">=0.30,<0.32"
pytest-xdist = "^3.8.0"
mypy = ">=1.14,<3.0"

[tool.pytest.ini_options]
asyncio_mode = "auto"
# Ensure pytest uses /app as root to discover conftest.py
# This is critical for centralized DB fixtures to work
pythonpath = "."
# NOTE: "api/tests" (not "api-service/tests") because Dockerfile.dev mounts
# ./api-service to /app/api inside the container where tests actually run.
testpaths = [
    "shared/tests",
    "api/tests",
    "workers/backtest/tests",
    "workers/daily/tests",
    "workers/fetch_price/tests",
    "scripts/tests"
]
addopts = "--cov-fail-under=90"

# Registrar markers para evitar warnings y habilitar ejecución selectiva
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests that require full DB setup",
    "unit: marks tests that use mocks/stubs only",
    "db: marks tests that use database fixtures",
    "asyncio: marks async tests (automatically detected)"
]

[tool.coverage_thresholds]
# Minimum line coverage, in percent, for each critical module. Checked by
# `scripts/check_coverage_thresholds.py` against the coverage.xml of the full
# pytest run (CI "Docker quality gate", `make validate`, pre-push hook), on top
# of the global `--cov-fail-under` above. A module listed here that is missing
# from the report fails the gate too (no test imports it, or it was renamed).
#
# Keys are repo-relative paths. How a value is chosen: measure the module, then
# take the largest multiple of 5 that is at least 2 points below the measured
# coverage. To raise a threshold after adding tests, re-measure with
#   docker compose exec api pytest --cov --cov-report=xml:/tmp/coverage.xml
# and apply the same rule. Never lower one to make a failing run pass: add the
# missing tests or explain the drop in the PR.
#
# Not listed, on purpose: `__init__.py` files without logic and test code.
"api-service/api/main.py" = 95
"api-service/api/models/backtesting.py" = 95
"api-service/api/models/predictions.py" = 95
"api-service/api/models/responses.py" = 95
"api-service/api/routers/backtesting.py" = 95
"api-service/api/routers/models.py" = 95
"api-service/api/routers/predictions.py" = 95
"api-service/api/routers/prices.py" = 95
"api-service/api/routers/routes.py" = 95
"api-service/api/symbols.py" = 95
"scripts/activate_model.py" = 95
"scripts/backtest.py" = 95
"scripts/backtest_engine.py" = 95
"scripts/backtest_report.py" = 90
"scripts/list_models.py" = 95
"scripts/load_binance_history.py" = 90
"shared/shared/assets.py" = 95
"shared/shared/baselines.py" = 95
"shared/shared/binance_vision.py" = 95
"shared/shared/config.py" = 95
"shared/shared/db/crud.py" = 95
"shared/shared/db/database.py" = 95
"shared/shared/db/models.py" = 95
"shared/shared/features.py" = 90
"shared/shared/model_baselines.py" = 95
"shared/shared/strategies.py" = 95
"shared/shared/utils.py" = 95
"workers/backtest/main.py" = 90
"workers/daily/__main__.py" = 90
"workers/daily/evaluator.py" = 90
"workers/daily/models/__init__.py" = 85
"workers/daily/models/base.py" = 70
"workers/daily/models/factory.py" = 95
"workers/daily/models/linear.py" = 95
"workers/daily/predictor.py" = 90
"workers/daily/trainer.py" = 90
"workers/fetch_price/main.py" = 90

[tool.mypy]
python_version = "3.13"
strict = true
plugins = ["pydantic.mypy"]
# explicit_package_bases + mypy_path lets mypy name shared/shared/* as
# "shared.*" and shared/tests/* as "tests.*" without adding __init__.py
# files there (which would break pytest test collection for sibling
# "tests" dirs elsewhere in the monorepo, e.g. workers/daily/tests).
# api/tests is itself a base so its files are top-level modules ("conftest",
# "test_main", ...) and do not clash with shared/tests ("Duplicate module named
# tests.conftest"). The api tests import each other by those top-level names
# (soup_helpers), which is also how pytest imports them.
mypy_path = "shared:api:api/tests"
explicit_package_bases = true
files = [
    "shared/shared",
    "shared/tests",
    "workers",
    "api",
    "scripts",
]
exclude = [
    "shared/alembic/",
    "shared/\\.venv/",
    "shared/poetry\\.lock",
]

[[tool.mypy.overrides]]
# These libraries ship neither stubs nor a py.typed marker.
module = ["sklearn.*"]
ignore_missing_imports = true

[tool.ruff]
line-length = 88
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.ruff.lint.isort]
# Without this, ruff's first-party auto-detection disagrees between the
# host (repo root has "api-service/") and the dev container (Dockerfile.dev
# mounts it as "/app/api"), sorting "api.*" imports differently depending
# on where ruff runs from. Pin it explicitly so lint is deterministic.
known-first-party = ["api", "shared", "workers"]

[tool.cosmic-ray]
module-path = "."
timeout = 30.0
excluded-modules = []
test-command = "pytest shared/tests/ api-service/tests/ workers/fetch_price/tests/ workers/daily/tests/"

[tool.cosmic-ray.distributor]
name = "local"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry-core.masonry.api"
