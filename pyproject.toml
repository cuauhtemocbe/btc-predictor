[tool.poetry]
name = "dockyard2sail-py"
version = "0.1.0"
description = ""
authors = []
packages = [{include = "app", from = "src"}]

[tool.poetry.dependencies]
python = "^3.12"
fastapi = ">=0.115.7"
uvicorn = {extras = ["standard"], version = "^0.34.0"}
starlette = ">=0.49.1"
sqlalchemy = "^2.0"
psycopg2-binary = "^2.9"
alembic = "^1.13"
pydantic-settings = "^2.0"
urllib3 = ">=2.7.0"
httpx = "^0.28.1"
shared = {path = "shared", develop = true}
scikit-learn = "^1.5.0"
numpy = "^2.0.0"

[tool.poetry.group.dev.dependencies]
pytest = "^8.3.0"
httpx = "^0.28.0"
pytest-asyncio = "^0.25.0"
pytest-cov = "^6.0.0"
ruff = "^0.9.0"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["shared/tests", "api/tests", "workers"]

[tool.ruff]
line-length = 88
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[build-system]
requires = ["poetry-core"]
build-backend = "poetry-core.masonry.api"
