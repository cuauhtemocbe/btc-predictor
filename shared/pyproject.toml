[tool.poetry]
name = "shared"
version = "0.1.0"
description = "Shared package with database configuration and utilities for BTC Predictor"
authors = ["Cuauhtémoc <cuauhtemocbe@gmail.com>"]
readme = "README.md"
packages = [{include = "shared"}]

[tool.poetry.dependencies]
python = "^3.13"
pydantic-settings = "^2.15"
# SQLAlchemy 2.1 defaults postgresql:// to psycopg v3 and we ship psycopg2:
# the app fails to boot ('No module named psycopg'). Lift the cap together
# with the driver.
sqlalchemy = ">=2.0,<2.1"
psycopg2-binary = "^2.9"
alembic = "^1.13"

[tool.poetry.group.dev.dependencies]
pytest = "^9.1"
pytest-cov = "^7.1"
pytest-mock = "^3.16"
pytest-asyncio = "^1.4"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
